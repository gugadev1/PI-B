spring.datasource.url=${TECHNOVA_DB_URL:jdbc:h2:file:./data/technova;AUTO_SERVER=TRUE}
spring.datasource.username=${TECHNOVA_DB_USER:sa}
spring.datasource.password=${TECHNOVA_DB_PASSWORD:}
spring.datasource.driver-class-name=${TECHNOVA_DB_DRIVER:org.h2.Driver}
spring.sql.init.mode=always
spring.jackson.default-property-inclusion=non_null
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
